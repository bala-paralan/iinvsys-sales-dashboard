version: '3.9'

# ─────────────────────────────────────────────────────────────────────
#  SECURITY NOTE — read before changing the `ports:` blocks below.
#
#  This stack was compromised twice (2026-04-27 and 2026-04-29) by the
#  Akira ransomware, which reached MongoDB through a `27018:27017` port
#  mapping that bound the database to 0.0.0.0 with no authentication.
#  The database was wiped both times.
#
#  Two rules follow from that, and neither is optional:
#
#   1. Mongo is NEVER published to the host. Containers reach it over the
#      compose network as `mongo:27017`. If you need a shell, use
#      `docker compose exec mongo mongosh` — do not add a port mapping.
#   2. Mongo runs WITH authentication. MONGO_ROOT_USER / MONGO_ROOT_PASS
#      are required; the stack will not start without them.
#
#  The API binds to 127.0.0.1 only. Nginx on the host proxies to it.
# ─────────────────────────────────────────────────────────────────────

services:
  # ── MongoDB ──────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: iinvsys_mongo
    restart: unless-stopped
    command: ['--auth']
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-iinvsys}
      # No defaults. `docker compose up` fails fast if these are unset.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:?MONGO_ROOT_PASS is required}
    volumes:
      - mongo_data:/data/db
    # DELIBERATELY NO `ports:` — see the security note above.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - -u
        - ${MONGO_ROOT_USER}
        - -p
        - ${MONGO_ROOT_PASS}
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ───────────────────────────────────────────────────
  api:
    build: .
    container_name: iinvsys_api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5050                          # Nginx proxies to this port
      # The DATABASE NAME IS A VARIABLE, and that is load-bearing.
      #
      # Compose overrides whatever `.env` says about MONGO_URI, so the database a
      # deployment talks to is decided here and nowhere else. It was hardcoded to
      # `iinvsys` while the running server had been hand-edited to `iinvsys_v2` — so a
      # `git pull` followed by `docker compose up` would silently move production back
      # onto the pre-v2 database. Greenfield cutovers are done by changing MONGO_DB.
      #
      #   v1  iinvsys        v2  iinvsys_v2        v3  iinvsys_v3
      #
      # Nothing is ever deleted: an old database stays in the same volume, which is what
      # makes a rollback one variable rather than a restore.
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongo:27017/${MONGO_DB:-iinvsys}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # ALL THREE OF THESE LIVED ONLY IN THE SERVER'S COPY OF THIS FILE until the V3
      # cutover, having been hand-edited during the v2 deploy and never committed. A pull
      # would have silently dropped them, so they are passthroughs now and the values
      # belong in .env where the rest of the deployment config already is.
      #
      # config/env.js REQUIRES CORS_ORIGINS in production and refuses to boot without it —
      # blank makes app.js reflect every origin WITH credentials:true, which is worse than
      # not starting.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Referrer invite links are built from this. Unset, expoController falls back to the
      # Host header, which the client controls.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Defaults to 'true' in app.js when unset, which loosens the CSP to allow the legacy
      # app's CDN scripts. v2 stopped serving that app; V3 does not serve it either.
      SERVE_LEGACY_APP: ${SERVE_LEGACY_APP:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@iinvsys.com}
      # No default. initAdmin refuses to bootstrap in production without it.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required to bootstrap the first superadmin}
    ports:
      # Bound to loopback only — Nginx on the host is the public entrypoint.
      - '127.0.0.1:5050:5050'
    healthcheck:
      # /api/ready, NOT /api/health.
      #
      # `health` answers without touching the database. When the mongo container exited
      # on 2026-07-23 the API kept reporting healthy against a hostname that no longer
      # resolved, so Docker never restarted it and Prometheus stayed green — production
      # could not log anyone in for 25 days and nothing said so. `ready` pings Mongo.
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5050/api/ready']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data:
    driver: local
